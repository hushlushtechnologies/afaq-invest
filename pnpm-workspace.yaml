packages:
  - 'apps/*'
  - 'packages/*'

# pnpm only runs dependency install scripts for packages set to true.
# Packages set to false ship prebuilt binaries or only run analytics, so their
# scripts are not needed. A dependency missing from this list makes
# `pnpm install` stop with ERR_PNPM_IGNORED_BUILDS — add new ones here.
allowBuilds:
  '@nestjs/core': false
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  sharp: false
  unrs-resolver: false
  prisma: true
  '@prisma/engines': true
